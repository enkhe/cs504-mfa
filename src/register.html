<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Create an Account</h2>
        <p class="subtitle">Enter your details to register.</p>
        <form id="registerForm">
            <input type="text" id="fn" placeholder="First Name" required>
            <input type="text" id="ln" placeholder="Last Name" required>
            <input type="text" id="un" placeholder="Username" required>
            <input type="email" id="em" placeholder="Email Address" required>
            <input type="password" id="pw" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p id="regSuccess" style="display: none; color: green; font-weight: bold; margin-top: 15px; text-align: center;">
            Successfully registered! Redirecting...
        </p>
        <p id="regError" class="error-msg" style="display: none;"></p>
        <div class="links">
            <a href="index.html">Back to Home</a>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
