<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login - SWE 2FA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- 1st: the user logs in. -->
        <div id="loginContainer">
            <h2>Sign In</h2>
            <p class="subtitle">Enter your credentials to access the portal.</p>
            <form id="loginForm">
                <input type="text" id="un" placeholder="Username" required>
                <input type="password" id="pw" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div class="links">
                <a href="register.html">Create an Account</a> | <a href="index.html">Home</a>
            </div>
        </div>

        <!-- 2nd: MFA Verification Form appears after the user logs in. -->
        <div id="mfaContainer" style="display: none;">
            <h2>Verify MFA</h2>
            <p class="subtitle">Please check your email for the 6-digit code.</p>
            <form id="verifyForm">
                <input type="text" id="code" placeholder="000000" pattern="\d{6}" required title="Enter the 6-digit code">
                <button type="submit">Verify Code</button>
            </form>
            <div class="links">
                <a href="login.html">Back to Login</a>
            </div>
        </div>

        <!-- Shared Error Messaging -->
        <p id="loginError" class="error-msg" style="display: none;"></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
